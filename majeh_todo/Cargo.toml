[package]
name = "majeh_todo"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_router = { version = "0.7" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Storage", "Location", "Navigator",
    "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement",
    "HtmlElement", "Element", "Event", "EventTarget", "MouseEvent",
    "KeyboardEvent", "DragEvent", "DataTransfer", "Blob",
    "BlobPropertyBag", "Url", "HtmlAnchorElement", "console",
    "FileList", "File", "FileReader",
] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "wasmbind", "clock"] }

gloo-storage = "0.4"
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.4", features = ["futures"] }

idb = "0.6"
uuid = { version = "1", features = ["v4", "js"] }

getrandom = { version = "0.3", features = ["wasm_js"] }

thiserror = "1.0"
console_error_panic_hook = "0.1"

[features]
default = ["csr"]
csr = ["leptos/csr"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
